<!doctype html>
<html lang="ru">
  <head>
     
    <meta charset="UTF-8" />
     
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     
    <title>PT Mono — Цирк</title>

     
    <link rel="preconnect" href="https://fonts.googleapis.com" />
     
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
     
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap"
      rel="stylesheet"
    />

     
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
     
    <main>
         
      <!-- Экран 1 -->
         
      <section class="screen screen-1">
              <img src="images/1 экран цирк.png" alt="" class="circus" />      
        <img src="images/1 экран гимаст.png" alt="" class="gymnast" />    
      </section>

         
      <!-- Экран 2 -->
         
      <section class="screen screen-2">
              <img src="images/2 экран билеты.png" alt="" />      
        <img src="images/2 экран касса.png" alt="" />      
        <img src="images/2 экран цена билетов.png" alt="" />    
      </section>

         
      <!-- Экран 3 -->
         
      <section class="screen screen-3">
              <img src="images/3 экран арена.png" alt="" />    
      </section>

         
      <!-- Экран 4 -->
         
      <section class="screen screen-4">
              <img src="images/экран 4 фон.png" alt="" class="screen-4-bg" />  
           
        <img src="images/ЭКРАН 4 ЗАНАВЕС.png" alt="" class="screen-4-curtain" />
             
        <img src="images/экран 4 жонглер.png" alt="" class="screen-4-juggler" />
           
      </section>

         
      <!-- Экран 5 -->
         
      <section class="screen screen-5">
              <img src="images/экран 5 символы.png" alt="" />    
      </section>

         
      <!-- Экран 6 -->
         
      <section class="screen screen-6">
              <img src="images/экран 6 карусель.png" alt="" />    
      </section>

       
    </main>

     
    <!-- Финальный постер -->
     
    <footer class="footer">
          <img src="images/футер билет.png" alt="" />    
      <img src="images/футер лого вшэ.png" alt="" />    
      <img src="images/футер марионетка.png" alt="" />    
      <img src="images/футер шатер.png" alt="" />  
    </footer>
  </body>
</html>
